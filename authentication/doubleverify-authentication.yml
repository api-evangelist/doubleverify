- name: dv-report-data-api-bearer
  type: http
  scheme: bearer
  applies_to: DV Report Data API (https://data-reporting.doubleverify.com)
  in: header
  parameter: Authorization
  token_issuance: >-
    Self-service inside DV Pinnacle: Analytics -> Data API -> Create Token, or select an
    existing token. The token value is used as a bearer token; integrator documentation
    notes the value is supplied WITHOUT the literal word "Bearer" in some connector UIs.
  token_contact: dataapi@doubleverify.com
  source: searched
  evidence:
  - https://improvado.io/docs/doubleverify
  - https://help.alliplatform.com/data/Working-version/doubleverify
  - probe https://data-reporting.doubleverify.com/requests -> 401

observed_challenges:
- url: https://mcp.doubleverify.com/mcp
  status: 401
  www_authenticate: Bearer error="invalid_token", error_description="The access token
    is missing or invalid", resource_metadata="https://mcp.doubleverify.com/.well-known/oauth-protected-resource/mcp",
    scope="openid email profile"
- url: https://data-reporting.doubleverify.com/requests
  status: 401
  www_authenticate: null
  note: Bare 401 with no WWW-Authenticate header and a zero-length body — the Report Data
    API does not advertise its auth scheme to an unauthenticated caller.
- url: https://developer.doubleverify.com/docs
  status: 200
  note: Redirects to /docs/login?return_to=%2Fdocs — the developer documentation portal
    itself is behind a login.

gaps:
- No securitySchemes can be verified against a machine-readable contract; DoubleVerify
  publishes no OpenAPI.
- The Report Data API returns no WWW-Authenticate header, so an agent cannot discover how
  to authenticate from the wire.
- Token lifetime, rotation and revocation policy for Report Data API tokens are documented
  only inside the gated developer portal.
