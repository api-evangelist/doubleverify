note: >-
  DoubleVerify publishes no rate limits. The developer portal that would document them
  (developer.doubleverify.com) redirects to a login, and neither API host returns a
  rate-limit header to an unauthenticated caller: the Report Data API answers a bare 401
  with a zero-length body and no RateLimit-*, X-RateLimit-* or Retry-After header, and the
  MCP endpoint answers 401 with only a WWW-Authenticate challenge. The one runtime pacing
  constraint that IS public comes from integrator documentation rather than DoubleVerify:
  a Report Data API request ID stays valid for 30 days from the time its data is available,
  which bounds retrieval but is a retention window, not a rate limit. Recorded as an honest
  zero.

