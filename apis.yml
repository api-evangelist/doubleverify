apis:
- name: DV Neura MCP Server
  description: >-
    A live remote Model Context Protocol endpoint that exposes DoubleVerify's media
    quality, verification and performance data to an AI assistant as the DV Neura Insight
    Agent. DoubleVerify states that clients can connect from Anthropic Claude today, with
    Google Gemini and Microsoft Copilot to follow. The endpoint is authenticated with an
    OAuth 2.1 bearer token issued by DoubleVerify's CIAM Keycloak realm
    (dv-ciam.doubleverify.com/realms/pinnacle) with the scopes openid, email and profile,
    so a DV Pinnacle account is required. An unauthenticated tools/list returns HTTP 401,
    which means the tool manifest and every tool inputSchema are gated; DoubleVerify
    publishes no OpenAPI and no public tool list, so no tools are recorded.
  humanURL: https://doubleverify.com/products/neura
  baseURL: https://mcp.doubleverify.com/mcp
  tags:
  - MCP
  - Agents
  - Media Measurement
  tags_raw:
  - MCP
  - Agent
  - Media Measurement
  properties:
  - type: MCPServer
    url: mcp/doubleverify-mcp.yml
  - type: Authentication
    url: authentication/doubleverify-authentication.yml
  - type: OAuthScopes
    url: scopes/doubleverify-scopes.yml
- name: DV Report Data API
  description: >-
    DoubleVerify's asynchronous reporting API. A caller submits a data request, receives an
    ID, and retrieves the result as a CSV stream once the data is available; the request ID
    stays valid for 30 days. Access tokens are minted by the user inside DV Pinnacle under
    Analytics then Data API. Known routed paths are /requests, /requestTypes, /compatibility
    and /dataloadtime, each of which returns HTTP 401 to an unauthenticated caller while the
    host root serves an anonymous health-check document. The reference documentation is
    behind a login at developer.doubleverify.com, and no OpenAPI is published.
  humanURL: https://developer.doubleverify.com/docs/client-integrations/extensions/report-data-api
  baseURL: https://data-reporting.doubleverify.com
  tags:
  - Reporting
  - Analytics
  - Media Measurement
